<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERCOMM // Discord Network</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-side: #0d111a;
      --bg-chat: #121824;
      --accent-cyan: #00f3ff;
      --accent-magenta: #ff0055;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --glass-bg: rgba(13, 17, 26, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }

    /* Modal Login */
    #auth-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-box {
      background: var(--bg-side); border: 1px solid var(--accent-cyan); padding: 2rem;
      border-radius: 8px; width: 350px; box-shadow: 0 0 20px rgba(0,243,255,0.2);
    }
    .auth-box h2 { font-family: 'Orbitron'; color: var(--accent-cyan); margin-bottom: 1rem; text-align: center; }
    .auth-box input {
      width: 100%; padding: 0.8rem; margin-bottom: 1rem; background: var(--bg-dark);
      border: 1px solid #1e293b; color: #fff; border-radius: 4px;
    }
    .auth-box button {
      width: 100%; padding: 0.8rem; background: var(--accent-cyan); color: #000;
      font-weight: bold; border: none; cursor: pointer; border-radius: 4px; font-family: 'Orbitron';
    }

    /* Interface Principal */
    #app-container { display: flex; width: 100vw; height: 100vh; visibility: hidden; }

    /* Servidores Sidebar */
    .servers-bar { width: 70px; background: #05070a; display: flex; flex-direction: column; align-items: center; padding-top: 1rem; gap: 1rem; border-right: 1px solid #1e293b; }
    .server-icon { width: 48px; height: 48px; background: var(--bg-side); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--accent-cyan); font-family: 'Orbitron'; }
    .server-icon:hover { border-radius: 12px; background: var(--accent-cyan); color: #000; }

    /* Canais Sidebar */
    .channels-bar { width: 240px; background: var(--bg-side); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
    .server-header { padding: 1rem; font-family: 'Orbitron'; border-bottom: 1px solid #1e293b; color: var(--accent-cyan); }
    .channel-list { padding: 1rem 0; flex: 1; }
    .channel-item { padding: 0.6rem 1rem; cursor: pointer; color: var(--text-muted); font-weight: bold; }
    .channel-item:hover, .channel-item.active { color: #fff; background: rgba(0,243,255,0.1); border-left: 3px solid var(--accent-cyan); }

    /* Área de Chat */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-header { padding: 1rem; background: var(--bg-side); border-bottom: 1px solid #1e293b; font-family: 'Orbitron'; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    
    .message-card { display: flex; gap: 1rem; background: rgba(255,255,255,0.02); padding: 0.8rem; border-radius: 6px; }
    .message-card.admin { border-left: 2px solid var(--accent-magenta); }
    .avatar { width: 40px; height: 40px; background: var(--accent-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; }
    .msg-meta { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.2rem; }
    .username { font-weight: bold; color: var(--accent-cyan); }
    .badge-admin { background: var(--accent-magenta); color: #fff; font-size: 0.6rem; padding: 2px 5px; border-radius: 3px; font-family: 'Orbitron'; }

    .chat-input-container { padding: 1rem; background: var(--bg-side); }
    .chat-input-container input {
      width: 100%; padding: 1rem; background: var(--bg-dark); border: 1px solid #1e293b;
      color: #fff; border-radius: 6px; outline: none;
    }
    .chat-input-container input:focus { border-color: var(--accent-cyan); }
  </style>
</head>
<body>

  <!-- Modal Autenticação -->
  <div id="auth-overlay">
    <div class="auth-box">
      <h2>CYBER // LOGIN</h2>
      <input type="text" id="login-user" placeholder="Usuário (Ex: admin)">
      <input type="password" id="login-pass" placeholder="Senha (Ex: ADMIN123)">
      <button onclick="login()">ACESSAR REDE</button>
      <p id="auth-error" style="color:var(--accent-magenta); margin-top:1rem; font-size:0.8rem; text-align:center;"></p>
    </div>
  </div>

  <!-- Painel Principal -->
  <div id="app-container">
    <div class="servers-bar">
      <div class="server-icon">CC</div>
    </div>

    <div class="channels-bar">
      <div class="server-header">CYBERCOMM MAIN</div>
      <div class="channel-list">
        <div class="channel-item active" onclick="switchChannel('geral')"># geral</div>
        <div class="channel-item" onclick="switchChannel('cyber-talk')"># cyber-talk</div>
        <div class="channel-item" onclick="switchChannel('memes-neon')"># memes-neon</div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="current-channel-title"># geral</div>
      <div class="chat-messages" id="messages-box"></div>
      <div class="chat-input-container">
        <input type="text" id="chat-input" placeholder="Enviar mensagem na rede..." onkeypress="handleKeyPress(event)">
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;
    let currentRole = 'user';
    let activeChannel = 'geral';

    async function login() {
      const username = document.getElementById('login-user').value;
      const password = document.getElementById('login-pass').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (res.ok) {
        currentUser = data.username;
        currentRole = data.role;
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('app-container').style.visibility = 'visible';
        
        socket.emit('joinChannel', activeChannel);
      } else {
        document.getElementById('auth-error').innerText = data.error;
      }
    }

    function switchChannel(channel) {
      activeChannel = channel;
      document.getElementById('current-channel-title').innerText = `# ${channel}`;
      socket.emit('joinChannel', channel);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        const text = e.target.value;
        if (!text.trim()) return;

        socket.emit('sendMessage', {
          channel: activeChannel,
          user: currentUser,
          text: text,
          role: currentRole
        });

        e.target.value = '';
      }
    }

    socket.on('loadHistory', (history) => {
      const box = document.getElementById('messages-box');
      box.innerHTML = '';
      history.forEach(renderMessage);
    });

    socket.on('newMessage', (msg) => {
      renderMessage(msg);
    });

    function renderMessage(msg) {
      const box = document.getElementById('messages-box');
      const div = document.createElement('div');
      div.className = `message-card ${msg.role === 'admin' ? 'admin' : ''}`;
      
      div.innerHTML = `
        <div class="avatar">${msg.user.substring(0, 2).toUpperCase()}</div>
        <div>
          <div class="msg-meta">
            <span class="username">${msg.user}</span>
            ${msg.role === 'admin' ? '<span class="badge-admin">ADMIN</span>' : ''}
            <span style="color:var(--text-muted); font-size:0.7rem">${msg.time}</span>
            <script src="/socket.io/socket.io.js"></script>
          </div>
          <div>${msg.text}</div>
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
